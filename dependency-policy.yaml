version: 1
allowed_module_sources:
  - cel.dev
  - cloud.google.com
  - github.com
  - go.opentelemetry.io
  - go.uber.org
  - go.yaml.in
  - golang.org
  - gonum.org
  - google.golang.org
  - gopkg.in
licenses:
  allow:
    - Apache-2.0
    - BSD-2-Clause
    - BSD-3-Clause
    - ISC
    - MIT
  deny:
    - AGPL-1.0-only
    - AGPL-1.0-or-later
    - AGPL-3.0-only
    - AGPL-3.0-or-later
exceptions: docs/development/dependency-exceptions.yaml

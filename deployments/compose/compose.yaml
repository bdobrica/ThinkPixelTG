name: thinkpixeltg-dev

services:
  postgres:
    image: postgres:18.6@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
    environment:
      POSTGRES_DB: thinkpixeltg
      POSTGRES_USER: thinkpixeltg
      POSTGRES_PASSWORD: ${TPTG_POSTGRES_PASSWORD:-local-only-postgres-password}
    ports:
      - "127.0.0.1:${TPTG_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thinkpixeltg -d thinkpixeltg"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [backend]
    restart: "no"

  valkey:
    image: valkey/valkey:9.1.1-alpine3.24@sha256:de31910896150d5e754a07d57d227cfdde4e258ddd0d1aa4607f2d2f95843715
    profiles: [cache]
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--requirepass", "${TPTG_VALKEY_PASSWORD:-local-only-valkey-password}"]
    ports:
      - "127.0.0.1:${TPTG_VALKEY_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${TPTG_VALKEY_PASSWORD:-local-only-valkey-password}", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
    networks: [backend]
    restart: "no"

  thinkpixelag:
    profiles: [governance]
    build:
      context: ../..
      dockerfile: deployments/compose/Dockerfile.fakes
    command: ["-kind=ag", "-address=:8080"]
    ports:
      - "127.0.0.1:${TPTG_AG_PORT:-58081}:8080"
    healthcheck:
      test: ["CMD", "/governance-fake", "-healthcheck=http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 20
    networks: [backend]
    restart: "no"

  thinkpixelgr:
    profiles: [governance]
    build:
      context: ../..
      dockerfile: deployments/compose/Dockerfile.fakes
    command: ["-kind=gr", "-address=:8080"]
    ports:
      - "127.0.0.1:${TPTG_GR_PORT:-58082}:8080"
    healthcheck:
      test: ["CMD", "/governance-fake", "-healthcheck=http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 20
    networks: [backend]
    restart: "no"

networks:
  backend:
    internal: true

volumes:
  postgres-data:
